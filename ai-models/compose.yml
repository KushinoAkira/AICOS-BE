# AI models service as an extra container next to the main stack (does not touch docker-compose.yml):
#
#   docker compose -f docker-compose.yml -f ai-models/compose.yml up -d --build
#   docker compose -f docker-compose.yml -f ai-models/compose.yml --profile llm up -d   # + local Ollama
#
# Service: http://127.0.0.1:8090/api/v1/ai/{chat,chat/stream,feedback/analyze,recommendations,models}
# Secrets (GROQ_API_KEY, DEEPSEEK_API_KEY) come from the shell / .env, never from the image.
# PhoBERT ONNX weights are mounted read-only from ./ai-models/models/feedback (train once: see README).

services:
  ai-models:
    image: aicos/ai-models:${AI_MODELS_TAG:-dev}
    container_name: aicos-ai-models
    build:
      context: ./ai-models
    restart: unless-stopped
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GROQ_API_KEYS: ${GROQ_API_KEYS:-}
      GROQ_MODEL: ${GROQ_MODEL:-openai/gpt-oss-120b}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      OLLAMA_TIMEOUT: ${OLLAMA_TIMEOUT:-60}
      CORS_ORIGINS: ${AI_CORS_ORIGINS:-http://localhost:8443,http://localhost:5173}
    ports:
      - "127.0.0.1:8090:8000"
    volumes:
      - ./ai-models/models/feedback:/app/models/feedback:ro
    # Hardening: non-root image, read-only root fs, no capabilities, resource caps.
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    networks: [default]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Optional local LLM fallback (needs a GPU for comfort). Models live in a named volume.
  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    container_name: aicos-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama-models:
