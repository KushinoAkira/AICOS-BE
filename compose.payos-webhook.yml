# Standalone preparation only. Do not merge with the operational compose files.
name: aicos-payos-webhook-test
services:
  webhook-proxy:
    image: ${AICOS_PAYOS_PROXY_IMAGE:?Select a reviewed nginx image pinned by digest}
    user: "101:101"
    entrypoint: ["nginx"]
    command: ["-g", "daemon off;"]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    ports: ["127.0.0.1:18081:8080"]
    volumes:
      - ./infra/payos-webhook/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/payos-webhook/result.html:/srv/payos/result.html:ro
    tmpfs: ["/tmp:rw,noexec,nosuid,size=16m,mode=1777"]
    networks: [gateway-runtime]
networks:
  gateway-runtime:
    external: true
    name: ${AICOS_PAYOS_GATEWAY_NETWORK:?Verify the existing Gateway network before use}
