title = "AICOS-BE"
[extend]
useDefault = true

[allowlist]
description = "Dev placeholders and generated training text that are not live credentials"
paths = [
  '''(?i)\.env\.example$''',
  '''ai-models/data/''',
  '''ai-models/models/.*/(vocab\.txt|bpe\.codes)$''',
  '''tests/''',
  '''docs/TESTING-GUIDE-FOR-ME\.md''',
]
regexes = [
  '''aicos_admin_dev''',
  '''aicos_dev''',
]
