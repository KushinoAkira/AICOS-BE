# AICOS - local stack (Docker Compose).
#
#   First time: scripts/init-env.ps1 (Windows) or scripts/init-env.sh - writes .env with random secrets.
#   Nothing secret has a default: compose stops with a clear message when a value in .env is missing.
#
#   docker compose up -d postgres redis      # infrastructure only (run services from the IDE)
#   docker compose up -d --build             # everything: infra + gateway + 11 services
#   docker compose --profile tools up -d     # + pgAdmin on http://localhost:5050
#
# Everything is reachable through the gateway: http://localhost:8080/api/v1/{orders|menu|...}/...
# Each service is ALSO exposed directly on 5101-5111 for debugging (Swagger: http://localhost:510x/swagger).
# Postgres, Redis and pgAdmin listen on 127.0.0.1 only. See .env.example for every variable.
# Database per service: one PostgreSQL container, one logical database per service (${POSTGRES_DB}_<service>, e.g. aicos_identity),
# each owned by its own login role. Created once by infra/postgres/init; change SERVICE_DB_PASSWORD only with `docker compose down -v`.

x-dotnet-env: &dotnet-env
  ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
  Swagger__Enabled: ${SWAGGER_ENABLED:-false}
  Payments__AllowSimulation: ${PAYMENTS_ALLOW_SIMULATION:-false}
  Database__MigrateOnStartup: "true"
  ConnectionStrings__Redis: redis:6379,password=${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - run scripts/init-env first}
  Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env - run scripts/init-env first}
  Services__Identity__BaseUrl: http://identity:8080
  Services__Menu__BaseUrl: http://menu:8080
  Services__Table__BaseUrl: http://table:8080
  Services__Order__BaseUrl: http://order:8080
  Services__Payment__BaseUrl: http://payment:8080
  Services__Kitchen__BaseUrl: http://kitchen:8080
  Services__Workforce__BaseUrl: http://workforce:8080
  Services__Reporting__BaseUrl: http://reporting:8080
  Services__Customer__BaseUrl: http://customer:8080
  Services__Ai__BaseUrl: http://ai:8000

x-dotnet-service: &dotnet-service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  # ------------------------------------------------------------------ infrastructure
  postgres:
    image: pgvector/pgvector:pg16
    container_name: aicos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aicos}
      POSTGRES_USER: ${POSTGRES_USER:-aicos_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env - run scripts/init-env first}
      SERVICE_DB_PASSWORD: ${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: aicos-redis
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - run scripts/init-env first}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - run scripts/init-env first}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: aicos-pgadmin
    profiles: ["tools"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@aicos.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?Set PGADMIN_PASSWORD in .env - run scripts/init-env first}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "127.0.0.1:5050:80"
    depends_on:
      postgres:
        condition: service_healthy

  # ------------------------------------------------------------------ gateway
  gateway:
    <<: *dotnet-service
    image: aicos/gateway
    container_name: aicos-gateway
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Gateway/AICOS.Gateway
        ASSEMBLY: AICOS.Gateway
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Payments__AllowSimulation: ${PAYMENTS_ALLOW_SIMULATION:-false}
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env - run scripts/init-env first}
      # Browser origins allowed to call the gateway (the web app: Vite dev 8443/5173, FE Docker image 8088). Override in .env.
      Cors__AllowedOrigins__0: ${CORS_ORIGIN_1:-http://localhost:8443}
      Cors__AllowedOrigins__1: ${CORS_ORIGIN_2:-http://localhost:8088}
      Cors__AllowedOrigins__2: ${CORS_ORIGIN_3:-http://localhost:5173}
      Cors__AllowedOrigins__3: ${CORS_ORIGIN_4:-http://127.0.0.1:8088}
      ReverseProxy__Clusters__identity__Destinations__primary__Address: http://identity:8080
      ReverseProxy__Clusters__menu__Destinations__primary__Address: http://menu:8080
      ReverseProxy__Clusters__table__Destinations__primary__Address: http://table:8080
      ReverseProxy__Clusters__order__Destinations__primary__Address: http://order:8080
      ReverseProxy__Clusters__payment__Destinations__primary__Address: http://payment:8080
      ReverseProxy__Clusters__kitchen__Destinations__primary__Address: http://kitchen:8080
      ReverseProxy__Clusters__workforce__Destinations__primary__Address: http://workforce:8080
      ReverseProxy__Clusters__reporting__Destinations__primary__Address: http://reporting:8080
      ReverseProxy__Clusters__customer__Destinations__primary__Address: http://customer:8080
      ReverseProxy__Clusters__ai__Destinations__primary__Address: http://ai:8000
    ports:
      - "8080:8080"
    depends_on:
      - identity
      - menu
      - table
      - order
      - payment
      - kitchen
      - workforce
      - reporting
      - customer
      - ai

  # ------------------------------------------------------------------ CORE
  identity:
    <<: *dotnet-service
    image: aicos/identity
    container_name: aicos-identity
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/IdentityOrganization/AICOS.IdentityOrganization.Api
        ASSEMBLY: AICOS.IdentityOrganization.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_identity;Username=identity_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
      Auth__SeedAdmin__Email: ${SEED_ADMIN_EMAIL:-admin@aicos.local}
      Auth__SeedAdmin__Password: ${SEED_ADMIN_PASSWORD:?Set SEED_ADMIN_PASSWORD in .env - run scripts/init-env first}
      # Mail (reset codes, brand approval). All empty by default: mails are only logged until SMTP_HOST and SMTP_FROM_ADDRESS are filled in .env.
      Email__Smtp__Host: ${SMTP_HOST:-}
      Email__Smtp__Port: ${SMTP_PORT:-587}
      Email__Smtp__Security: ${SMTP_SECURITY:-StartTls}
      Email__Smtp__Username: ${SMTP_USERNAME:-}
      Email__Smtp__Password: ${SMTP_PASSWORD:-}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:-}
      Email__FromName: ${SMTP_FROM_NAME:-AICOS}
      Email__AppUrl: ${APP_URL:-}
      Seed__DemoPlans: ${SEED_DEMO_PLANS:-true}
      # Sign in with Google (empty: off).
      Google__ClientId: ${GOOGLE_CLIENT_ID:-}
    ports: ["5101:8080"]

  # ------------------------------------------------------------------ COMMERCE
  menu:
    <<: *dotnet-service
    image: aicos/menu
    container_name: aicos-menu
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/MenuCatalog/AICOS.MenuCatalog.Api
        ASSEMBLY: AICOS.MenuCatalog.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_menu;Username=menu_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports: ["5102:8080"]

  table:
    <<: *dotnet-service
    image: aicos/table
    container_name: aicos-table
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/TableReservation/AICOS.TableReservation.Api
        ASSEMBLY: AICOS.TableReservation.Api
    environment:
      <<: *dotnet-env
      Tables__QrBaseUrl: ${APP_URL:-http://localhost:8443}/q
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_table_reservation;Username=table_reservation_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports: ["5103:8080"]

  order:
    <<: *dotnet-service
    image: aicos/order
    container_name: aicos-order
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/Ordering/AICOS.Ordering.Api
        ASSEMBLY: AICOS.Ordering.Api
    environment:
      <<: *dotnet-env
      Database__MigrateOnStartup: "true"
      KitchenAdmission__CaptureEnabled: ${KITCHEN_ADMISSION_CAPTURE_ENABLED:-false}
      KitchenAdmission__DispatcherEnabled: ${KITCHEN_ADMISSION_DISPATCHER_ENABLED:-false}
      KitchenAdmission__ReconciliationEnabled: ${KITCHEN_ADMISSION_RECONCILIATION_ENABLED:-false}
      KitchenAdmission__MachineKey: ${KITCHEN_ADMISSION_MACHINE_KEY:-}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_ordering;Username=ordering_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports: ["5104:8080"]

  payment:
    <<: *dotnet-service
    image: aicos/payment
    container_name: aicos-payment
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/Payments/AICOS.Payments.Api
        ASSEMBLY: AICOS.Payments.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_payment;Username=payment_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
      Payments__SecretKey: ${PAYMENTS_SECRET_KEY:?Set PAYMENTS_SECRET_KEY in .env - run scripts/init-env first}
    ports: ["5105:8080"]

  # ------------------------------------------------------------------ OPERATIONS
  kitchen:
    <<: *dotnet-service
    image: aicos/kitchen
    container_name: aicos-kitchen
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/KitchenOperations/AICOS.KitchenOperations.Api
        ASSEMBLY: AICOS.KitchenOperations.Api
    environment:
      <<: *dotnet-env
      Database__MigrateOnStartup: "true"
      KitchenAdmission__ReceiverEnabled: ${KITCHEN_ADMISSION_RECEIVER_ENABLED:-false}
      KitchenAdmission__MachineKey: ${KITCHEN_ADMISSION_MACHINE_KEY:-}
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_kitchen;Username=kitchen_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports: ["5107:8080"]

  workforce:
    <<: *dotnet-service
    image: aicos/workforce
    container_name: aicos-workforce
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/WorkforceScheduling/AICOS.WorkforceScheduling.Api
        ASSEMBLY: AICOS.WorkforceScheduling.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_workforce;Username=workforce_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports: ["5108:8080"]

  # ------------------------------------------------------------------ INSIGHT
  reporting:
    <<: *dotnet-service
    image: aicos/reporting
    container_name: aicos-reporting
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/ReportingAnalytics/AICOS.ReportingAnalytics.Api
        ASSEMBLY: AICOS.ReportingAnalytics.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_reporting;Username=reporting_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports: ["5109:8080"]

  customer:
    <<: *dotnet-service
    image: aicos/customer
    container_name: aicos-customer
    build:
      context: .
      dockerfile: docker/Dockerfile.dotnet
      args:
        PROJECT: src/Services/CustomerEngagement/AICOS.CustomerEngagement.Api
        ASSEMBLY: AICOS.CustomerEngagement.Api
    environment:
      <<: *dotnet-env
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=${POSTGRES_DB:-aicos}_customer;Username=customer_svc;Password=${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}
    ports: ["5110:8080"]

  # ------------------------------------------------------------------ AI (Python)
  ai:
    <<: *dotnet-service
    image: aicos/ai
    container_name: aicos-ai
    build:
      context: ./src/Services/Ai
    environment:
      DATABASE_URL: postgresql://ai_svc:${SERVICE_DB_PASSWORD:?Set SERVICE_DB_PASSWORD in .env - run scripts/init-env first}@postgres:5432/${POSTGRES_DB:-aicos}_ai
      REDIS_URL: redis://:${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env - run scripts/init-env first}@redis:6379/0
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env - run scripts/init-env first}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
    ports: ["5111:8000"]

volumes:
  postgres-data:
  redis-data:
