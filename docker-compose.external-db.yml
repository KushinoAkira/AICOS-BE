  kitchen:
    depends_on: !override
      <<: *external-dependencies
    environment:
      ConnectionStrings__Default: Host=${AICOS_DB_HOST:-host.docker.internal};Port=${AICOS_DB_PORT:-5432};Database=aicos_db;Username=kitchen_svc;Password=${KITCHEN_DB_PASSWORD:?Set KITCHEN_DB_PASSWORD}
  workforce:
