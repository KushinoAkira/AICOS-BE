      <<: *external-dependencies
    environment:
      ConnectionStrings__Default: Host=${AICOS_DB_HOST:-host.docker.internal};Port=${AICOS_DB_PORT:-5432};Database=aicos_db;Username=table_reservation_svc;Password=${TABLE_DB_PASSWORD:?Set TABLE_DB_PASSWORD}
  order:
