# Use with the base Compose file to reach the existing host PostgreSQL.
# Configuration only: do not start the stack before database/roles approval.
x-external-dependencies: &external-dependencies
  redis:
    condition: service_healthy
services:
  postgres:
    profiles: ["provisioning-only"]
  pgadmin:
    depends_on: !reset {}
  identity:
    depends_on: !override
      <<: *external-dependencies
    environment:
      ConnectionStrings__Default: Host=${AICOS_DB_HOST:-host.docker.internal};Port=${AICOS_DB_PORT:-5432};Database=aicos_db;Username=identity_svc;Password=${IDENTITY_DB_PASSWORD:?Set IDENTITY_DB_PASSWORD}
  menu:
    depends_on: !override
      <<: *external-dependencies
    environment:
      ConnectionStrings__Default: Host=${AICOS_DB_HOST:-host.docker.internal};Port=${AICOS_DB_PORT:-5432};Database=aicos_db;Username=menu_svc;Password=${MENU_DB_PASSWORD:?Set MENU_DB_PASSWORD}
  table:
