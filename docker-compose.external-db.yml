      ConnectionStrings__Default: Host=${AICOS_DB_HOST:-host.docker.internal};Port=${AICOS_DB_PORT:-5432};Database=aicos_db;Username=reporting_svc;Password=${REPORTING_DB_PASSWORD:?Set REPORTING_DB_PASSWORD}
  customer:
    depends_on: !override
      <<: *external-dependencies
    environment:
      ConnectionStrings__Default: Host=${AICOS_DB_HOST:-host.docker.internal};Port=${AICOS_DB_PORT:-5432};Database=aicos_db;Username=customer_svc;Password=${CUSTOMER_DB_PASSWORD:?Set CUSTOMER_DB_PASSWORD}
  ai:
    depends_on: !override
      <<: *external-dependencies
    environment:
      DATABASE_URL: postgresql://ai_svc:${AI_DB_PASSWORD:?Set AI_DB_PASSWORD}@${AICOS_DB_HOST:-host.docker.internal}:${AICOS_DB_PORT:-5432}/aicos_db
