name: Security

on:
  push:
    branches: [main, develop]
  pull_request:
  schedule:
    - cron: "17 3 * * 1" # weekly, Monday 03:17 UTC

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: docker run --rm -v "$PWD:/src:ro" ghcr.io/gitleaks/gitleaks:v8.21.2 detect --source=/src --verbose --redact --config=/src/.gitleaks.toml

  # Code scanning upload needs GitHub Advanced Security (paid on private repos).
  codeql:
    name: CodeQL (${{ matrix.language }})
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: csharp
            build-mode: autobuild
          - language: python
            build-mode: none
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: matrix.language == 'csharp'
        with:
          dotnet-version: 8.0.x
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          category: codeql-${{ matrix.language }}

  nuget-audit:
    name: NuGet vulnerable packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet restore AICOS.sln
      - name: Fail on known vulnerabilities (direct and transitive)
        run: |
          dotnet list AICOS.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qE "^\s+>\s" audit.txt; then echo "::error::Vulnerable NuGet packages found"; exit 1; fi

  dependency-review:
    name: Dependency review (PR)
    if: github.event_name == 'pull_request' && !github.event.repository.private
    continue-on-error: true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  iac:
    name: Trivy config + filesystem (Dockerfiles, compose, secrets)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
