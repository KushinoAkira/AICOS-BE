name: Docker images

# PR: Compose smoke validates the whole stack once (no GHCR publish).
# Push to main / version tags: build, scan, push each service image with SBOM + provenance.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths:
      - "src/**"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "scripts/smoke-docker.sh"
      - "scripts/tests/**"
      - "Directory.*.props"
      - "global.json"
      - ".github/workflows/docker-images.yml"
  pull_request:
    paths:
      - "src/**"
      - "docker/**"
      - "docker-compose.yml"
      - "docker-compose.ci.yml"
      - "scripts/smoke-docker.sh"
      - "scripts/tests/**"
      - "Directory.*.props"
      - "global.json"
      - ".github/workflows/docker-images.yml"

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  OWNER: ${{ github.repository_owner }}

jobs:
  compose-smoke:
    name: Compose stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      COMPOSE_PROJECT_NAME: aicos-ci-${{ github.run_id }}-${{ github.run_attempt }}
      AICOS_CI_MIGRATE_ON_STARTUP: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Generate throwaway secrets
        run: bash scripts/init-env.sh
      - name: Smoke script regression (offline)
        run: bash scripts/tests/smoke-docker-test.sh
      - name: Validate CI Compose configuration
        run: docker compose config --quiet
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 600
      - name: Smoke test through the gateway
        run: bash scripts/smoke-docker.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Tear down
        if: always()
        run: docker compose down -v

  publish:
    name: Publish ${{ matrix.name }}
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: gateway,   project: src/Gateway/AICOS.Gateway,                                 assembly: AICOS.Gateway }
          - { name: identity,  project: src/Services/IdentityOrganization/AICOS.IdentityOrganization.Api, assembly: AICOS.IdentityOrganization.Api }
          - { name: menu,      project: src/Services/MenuCatalog/AICOS.MenuCatalog.Api,            assembly: AICOS.MenuCatalog.Api }
          - { name: table,     project: src/Services/TableReservation/AICOS.TableReservation.Api,  assembly: AICOS.TableReservation.Api }
          - { name: order,     project: src/Services/Ordering/AICOS.Ordering.Api,                  assembly: AICOS.Ordering.Api }
          - { name: payment,   project: src/Services/Payments/AICOS.Payments.Api,                  assembly: AICOS.Payments.Api }
          - { name: kitchen,   project: src/Services/KitchenOperations/AICOS.KitchenOperations.Api, assembly: AICOS.KitchenOperations.Api }
          - { name: workforce, project: src/Services/WorkforceScheduling/AICOS.WorkforceScheduling.Api, assembly: AICOS.WorkforceScheduling.Api }
          - { name: reporting, project: src/Services/ReportingAnalytics/AICOS.ReportingAnalytics.Api, assembly: AICOS.ReportingAnalytics.Api }
          - { name: customer,  project: src/Services/CustomerEngagement/AICOS.CustomerEngagement.Api, assembly: AICOS.CustomerEngagement.Api }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/aicos-${{ matrix.name }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Build (local, for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dotnet
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
          load: true
          tags: aicos/${{ matrix.name }}:scan
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aicos/${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: hashFiles(format('trivy-{0}.sarif', matrix.name)) != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}
      - name: Trivy gate (HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aicos/${{ matrix.name }}:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.dotnet
          build-args: |
            PROJECT=${{ matrix.project }}
            ASSEMBLY=${{ matrix.assembly }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=${{ matrix.name }}

  publish-ai:
    name: Publish ai (Python)
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.OWNER }}/aicos-ai
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: src/Services/Ai
          load: true
          tags: aicos/ai:scan
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai
      - name: Trivy SARIF report
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aicos/ai:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-ai.sarif
          exit-code: "0"
      - name: Upload Trivy SARIF
        if: hashFiles('trivy-ai.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        continue-on-error: true
        with:
          sarif_file: trivy-ai.sarif
          category: trivy-ai
      - name: Trivy gate (HIGH/CRITICAL with fixes)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: aicos/ai:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          exit-code: "1"
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: src/Services/Ai
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=ai
