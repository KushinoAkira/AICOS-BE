name: aicos-payment-integration

services:
  postgres-payment-test:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: aicos_payment_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aicos_payment_test
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aicos_payment_test"]
      interval: 2s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

