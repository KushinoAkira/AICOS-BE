pid /tmp/nginx.pid;
worker_processes 1;
error_log /dev/stderr crit;

events { worker_connections 128; }

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    server {
        listen 8080;
        client_max_body_size 32k;
        client_body_timeout 10s;
        send_timeout 15s;

        location = /api/v1/payments/payos/webhook {
            if ($request_uri != "/api/v1/payments/payos/webhook") { return 404; }
            if ($request_method != POST) { return 405; }
            proxy_pass http://gateway:8080;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_set_header Host gateway;
            proxy_set_header Content-Type application/json;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;
        }

        location = /api/v1/payments/payos/return {
            if ($request_uri !~ "^/api/v1/payments/payos/return($|[?])") { return 404; }
            if ($request_method != GET) { return 405; }
            proxy_pass http://gateway:8080;
            proxy_http_version 1.1;
            proxy_pass_request_headers off;
            proxy_pass_request_body off;
            proxy_set_header Host gateway;
            proxy_set_header Content-Length "";
            proxy_set_header X-Aicos-Return-Read-Only 1;
            proxy_hide_header Set-Cookie;
            proxy_connect_timeout 3s;
            proxy_read_timeout 15s;
            proxy_send_timeout 15s;
            proxy_next_upstream off;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
        }

        location = /payos/result {
            if ($request_uri !~ "^/payos/result($|[?])") { return 404; }
            if ($request_method != GET) { return 405; }
            alias /srv/payos/result.html;
            default_type text/html;
            charset utf-8;
            add_header Cache-Control "no-store" always;
            add_header Referrer-Policy "no-referrer" always;
            add_header X-Content-Type-Options "nosniff" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; frame-ancestors 'none'; base-uri 'none'; form-action 'none'" always;
        }

        location / { return 404; }
    }
}
